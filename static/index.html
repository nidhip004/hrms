const FLD=[['name','Full name'],['dob','Date of birth','date'],['gender','Gender','sel',['Male','Female']],['pEmail','Personal email'],['oEmail','Official email'],['mobile','Mobile'],['emerg','Emergency contact'],['cAddr','Current address'],['pAddr','Permanent address'],['company','Company','co'],['dept','Department'],['desig','Designation'],['manager','Reporting manager','mgr'],['doj','Date of joining','date'],['loc','Work location'],['prob','Probation (months)','number'],['status','Status','sel',STAT],['pan','PAN','s'],['aadhaar','Aadhaar','s'],['bank','Bank name','s'],['acct','Account number','s'],['ifsc','IFSC','s']];
function inp([k,l,t,o],e,rev){const v=e[k]??'',id='f_'+k,opt=a=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');

function getLoc(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('This browser cannot share location. Use a current Chrome, Edge, Safari or Firefox.'));

function holView(){

});

${coTabs.length?`<div class="bar" style="margin-bottom:12px"><b>Company:</b> ${coTabs.map(([val,lbl])=>`<button class="${coFlt==val?'':'g'}" onclick="ui.co='${val}';render()">${lbl}</button>`).join('')}</div>`:''}
${isOB?`<div class="ban" style="border-left:4px solid var(--wa);margin-bottom:14px"><b>OB Services Holiday Policy:</b><br>1) Total of 11 fixed holidays and 1 restricted holiday. (Tentative schedule lists 9 fixed dates; 2 additional fixed holidays announced by management as applicable).<br>2) Employees can avail <b>only 01 restricted holiday</b> from the restricted list, subject to prior approval.</div>`:''}
<div class="grid"><div class="card"><div class="mu">Total holidays</div><div class="n">${byCo.length}</div></div><div class="card"><div class="mu">Fixed holidays</div><div class="n">${fixedCount}</div></div>${restrCount?`<div class="card"><div class="mu">Restricted holidays</div><div class="n">${restrCount}</div></div>`:''}<div class="card"><div class="mu">Upcoming holidays</div><div class="n">${upCount}</div></div></div>
<div class="bar"><b>Type:</b> ${['All','Fixed','Restricted'].filter(ty=>ty!='Restricted'||restrCount>0).map(f=>`<button class="${f==typeFlt?'':'g'}" onclick="ui.holType='${f}';render()">${f}</button>`).join('')} <span style="width:10px"></span> <b>Status:</b> ${['All','Upcoming','Past'].map(f=>`<button class="${f==timeFlt?'':'g'}" onclick="ui.holFlt='${f}';render()">${f}</button>`).join('')} <input placeholder="Search occasion or date" value="${esc(ui.holQ||'')}" oninput="ui.holQ=this.value;render()"></div>
<div class="w"><table><tr><th style="width:65px">Sr. No.</th><th>Festival / Occasion</th><th>Tentative Date</th><th>Day</th>${hr&&coFlt=='All'?'<th>Company</th>':''}<th>Type</th><th>Status</th>${hr?'<th>Action</th>':''}</tr>${filtered.map((h,i)=>{
  const isUp=h.day>t,isToday=h.day==t,stTag=isToday?'<span class="tag ok">Today</span>':isUp?'<span class="tag ac">Upcoming</span>':'<span class="tag mu">Past</span>';

}).join('')||'<tr><td colspan="8">No holidays found</td></tr>'}</table></div>
${hr?`<h3>Add holiday</h3><div class="bar"><input id="h_n" placeholder="Festival / Occasion" size="26"><input id="h_d" type="date"><select id="h_co"><option value="Internovo, Interface" ${coFlt=='Internovo & Interface'?'selected':''}>Internovo, Interface</option><option value="OB Services" ${coFlt=='OB Services'?'selected':''}>OB Services</option><option value="All" ${coFlt=='All'?'selected':''}>All Companies</option></select><select id="h_k"><option value="Fixed">Fixed</option><option value="Restricted">Restricted</option></select><button onclick="addHol()">Add holiday</button></div>`:''}`}
function set(){const hrs2=S.emps.filter(e=>e.role=='hr');return`<h2>Settings</h2><h3>Leave types</h3><div class="w"><table><tr><th>Name<th>Behaviour</tr>${S.types.map(t=>`<tr><td>${esc(t.name)}<td>${{paid:'Paid leave (uses balance)',lwp:'Leave without pay',wfh:'Work from home'}[t.kind]}</tr>`).join('')}</table></div><div class="bar"><input id="t_n" placeholder="New leave type"><select id="t_k"><option value="paid">Paid</option><option value="lwp">Without pay</option><option value="wfh">Work from home</option></select><button onclick="addType()">Add</button></div><h3>Holidays (excluded from leave day counts)</h3><div class="bar" style="margin:6px 0"><b>Filter:</b> ${[['All','All Companies'],['Internovo & Interface','Internovo & Interface'],['OB Services','OB Services']].map(([val,lbl])=>`<button class="${(ui.setHolCo||'All')==val?'':'g'}" style="padding:4px 10px;font-size:12px" onclick="ui.setHolCo='${val}';render()">${lbl}</button>`).join('')}</div><div class="w"><table><tr><th>Date<th>Event<th>Company<th>Type<th>Action</tr>${holList().filter(h=>matchesCo(h,ui.setHolCo||'All')).map(h=>`<tr><td>${h.day}<td>${esc(h.name||'—')}<td>${esc(h.company||'All')}<td>${tag(h.kind||'Fixed')}<td><button class="g" style="padding:4px 8px;font-size:12px" onclick="delHol(${h.id||`'${h.day}'`})">Delete</button></td></tr>`).join('')}</table></div><div class="bar"><input id="h_n_set" placeholder="Holiday name"><input id="h_d_set" type="date"><select id="h_co_set"><option value="Internovo, Interface">Internovo, Interface</option><option value="OB Services">OB Services</option><option value="All">All Companies</option></select><select id="h_k_set"><option value="Fixed">Fixed</option><option value="Restricted">Restricted</option></select><button onclick="addHolSet()">Add holiday</button></div><h3>HR users</h3><div class="w"><table><tr><th>Name<th>Access</tr>${hrs2.map(e=>`<tr><td>${esc(e.name)}<td>${e.scope=='all'?'All companies':e.scope}</tr>`).join('')}</table></div>${S.dev?`<h3>Sent emails (dev inbox)</h3>${mailList()}`:''}<h3>Audit log</h3><div class="w"><table><tr><th>When<th>User<th>Action</tr>${S.audit.map(a=>`<tr><td>${esc(a.t)}<td>${esc(a.u)}<td>${esc(a.a)}</tr>`).join('')||'<tr><td colspan="3">Nothing logged yet</tr>'}</table></div>`}

function snap(){const d={};document.querySelectorAll('input[id],select[id]').forEach(el=>{if(el.type!='password')d[el.id]=el.type=='checkbox'?el.checked:el.value});return d}
